services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file: .env
    environment: &shared
      BROLL_DATA_DIR: /data
      BROLL_DATABASE: /data/jobs.sqlite3
      BROLL_STORAGE: s3
      BROLL_S3_ENDPOINT: http://minio:9000
      BROLL_S3_PUBLIC_ENDPOINT: http://localhost:9000
      BROLL_S3_BUCKET: broll
    volumes: ["jobs:/data"]
    depends_on:
      storage-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6
  worker:
    build: .
    command: ["python", "-m", "broll.worker"]
    env_file: .env
    environment: *shared
    volumes: ["jobs:/data"]
    depends_on:
      storage-init: {condition: service_completed_successfully}
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    environment:
      MINIO_ROOT_USER: ${BROLL_S3_ACCESS_KEY:?Set BROLL_S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${BROLL_S3_SECRET_KEY:?Set BROLL_S3_SECRET_KEY in .env}
    volumes: ["objects:/data"]
  storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 "$$BROLL_S3_ACCESS_KEY" "$$BROLL_S3_SECRET_KEY"; do sleep 2; done;
        mc mb --ignore-existing local/broll
    depends_on: [minio]
volumes:
  jobs:
  objects:
