[project]
name = "incubrix-broll"
version = "0.1.0"
description = "Honest, adapter-based narration-to-video service foundation"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.5,<3", "httpx>=0.27,<1", "python-multipart>=0.0.18,<1", "boto3>=1.35,<2", "PyYAML>=6,<7"]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
