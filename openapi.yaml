components:
  schemas:
    Accepted:
      properties:
        job_id:
          type: string
          title: Job Id
        status_url:
          type: string
          title: Status Url
      type: object
      required:
      - job_id
      - status_url
      title: Accepted
    Body_upload_api_v1_uploads_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_api_v1_uploads_post
    Captions:
      properties:
        burn_in:
          type: boolean
          title: Burn In
          default: true
        srt:
          type: boolean
          title: Srt
          default: true
      additionalProperties: false
      type: object
      title: Captions
    ErrorDetail:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        retryable:
          type: boolean
          title: Retryable
        details:
          additionalProperties: true
          type: object
          title: Details
      type: object
      required:
      - code
      - message
      - retryable
      - details
      title: ErrorDetail
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      type: object
      required:
      - error
      title: ErrorResponse
    JobInput:
      properties:
        audio_url:
          anyOf:
          - type: string
            maxLength: 2048
          - type: 'null'
          title: Audio Url
        upload_id:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{64}\.(mp3|wav|m4a)$
          - type: 'null'
          title: Upload Id
        script:
          anyOf:
          - type: string
            maxLength: 30000
            minLength: 1
          - type: 'null'
          title: Script
        scenes:
          anyOf:
          - items:
              $ref: '#/components/schemas/SceneInput'
            type: array
            maxItems: 150
            minItems: 1
          - type: 'null'
          title: Scenes
        voice:
          type: string
          maxLength: 100
          title: Voice
          default: en-IN-female
        aspect_ratios:
          items:
            type: string
            enum:
            - '16:9'
            - '9:16'
            - '1:1'
          type: array
          maxItems: 3
          minItems: 1
          title: Aspect Ratios
        style:
          type: string
          maxLength: 1000
          title: Style
          default: bright, modern, real-world footage
        avoid:
          items:
            type: string
          type: array
          maxItems: 50
          title: Avoid
        captions:
          $ref: '#/components/schemas/Captions'
      additionalProperties: false
      type: object
      title: JobInput
    JobStatus:
      properties:
        job_id:
          type: string
          title: Job Id
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          title: Status
        progress:
          type: integer
          maximum: 100.0
          minimum: 0.0
          title: Progress
        results:
          additionalProperties:
            type: string
          type: object
          title: Results
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorDetail'
          - type: 'null'
        attempts:
          type: integer
          title: Attempts
      type: object
      required:
      - job_id
      - status
      - progress
      - results
      - error
      - attempts
      title: JobStatus
    SceneInput:
      properties:
        text:
          type: string
          maxLength: 3000
          minLength: 1
          title: Text
        visual_hint:
          type: string
          maxLength: 1000
          title: Visual Hint
          default: ''
      additionalProperties: false
      type: object
      required:
      - text
      title: SceneInput
    SwapInput:
      properties:
        clip_id:
          type: string
          maxLength: 200
          minLength: 1
          title: Clip Id
      additionalProperties: false
      type: object
      required:
      - clip_id
      title: SwapInput
    UploadResult:
      properties:
        upload_id:
          type: string
          title: Upload Id
        bytes:
          type: integer
          title: Bytes
      type: object
      required:
      - upload_id
      - bytes
      title: UploadResult
